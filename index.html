<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constellia Clicker: Boss Raid</title>
    <style>
        :root { 
            --mana-blue: #00d4ff; 
            --star-silver: #e0e0e0;
            --hp-red: #ff4d4d;
            --exp-gold: #ffd700;
        }
        body { 
            background-color: #050208; color: var(--mana-blue); 
            font-family: 'Garamond', serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; margin: 0; padding: 20px;
            background-image: radial-gradient(circle at center, #1a0b2e 0%, #050208 100%);
        }

        /* Mage Gauge */
        .mage-container { position: relative; width: 250px; height: 250px; margin-bottom: 10px; }
        #mageGauge { width: 100%; height: 100%; object-fit: contain; transition: filter 0.3s; }

        /* Boss HP Bar */
        .boss-area { width: 480px; margin-bottom: 20px; text-align: center; }
        .hp-background { background: #222; height: 25px; width: 100%; border: 1px solid var(--star-silver); border-radius: 5px; overflow: hidden; position: relative; }
        .hp-fill { background: linear-gradient(90deg, #800000, var(--hp-red)); height: 100%; width: 100%; transition: width 0.3s ease-out; }
        .hp-text { position: absolute; width: 100%; top: 0; left: 0; color: white; font-weight: bold; font-size: 0.9rem; line-height: 25px; text-shadow: 1px 1px 2px black; }

        .constellia-box { 
            border: 2px solid var(--mana-blue); padding: 30px; background: rgba(5, 2, 8, 0.9); 
            width: 480px; text-align: center; border-radius: 15px; box-shadow: 0 0 30px rgba(0, 212, 255, 0.15);
        }
        
        .mana-display { font-size: 2.2rem; font-weight: bold; margin: 5px 0; color: #fff; }
        .sp-display { color: var(--exp-gold); font-size: 1.1rem; margin-bottom: 15px; font-weight: bold; }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        button { 
            background: rgba(0, 212, 255, 0.05); color: var(--mana-blue); border: 1px solid var(--mana-blue); 
            padding: 12px; cursor: pointer; text-transform: uppercase; transition: 0.3s; font-weight: bold; border-radius: 5px;
        }
        button:hover:not(:disabled) { background: var(--mana-blue); color: #000; }
        button:disabled { border-color: #444 !important; color: #444 !important; cursor: not-allowed; opacity: 0.5; }

        .upgrade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .upgrade-card { border: 1px solid rgba(255, 215, 0, 0.3); padding: 10px; font-size: 0.8rem; border-radius: 5px; }

        /* Animation Classes */
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .boss-hit { animation: shake 0.2s ease-in-out 2; }
    </style>
</head>
<body onload="init()">

<div class="boss-area" id="bossContainer">
    <div style="color: var(--hp-red); font-weight: bold; letter-spacing: 3px; margin-bottom: 5px;">CELESTIAL ENTITY</div>
    <div class="hp-background">
        <div class="hp-fill" id="hpFill"></div>
        <div class="hp-text" id="hpText">100 / 100 HP</div>
    </div>
</div>

<div class="mage-container">
    <img src="image_2a4d99.jpg" id="mageGauge" alt="Mana Mage">
</div>

<div class="constellia-box">
    <div class="mana-display" id="manaView">0 MANA</div>
    <div class="sp-display" id="spView">SKILL POINTS: 0</div>
    
    <div class="btn-group">
        <button onclick="clickMana()">Channel Mana</button>
        <button onclick="manaBurst()" id="burstBtn" style="border-color: var(--hp-red); color: var(--hp-red);">Mana Burst (All Mana)</button>
    </div>

    <div class="upgrade-grid">
        <div class="upgrade-card">
            <div>Mana Potency (Lvl <span id="lvlClick">0</span>)</div>
            <button onclick="buyUpgrade('click')" id="btnClick">Upgrade (1 SP)</button>
        </div>
        <div class="upgrade-card">
            <div>Auto Flux (Lvl <span id="lvlAuto">0</span>)</div>
            <button onclick="buyUpgrade('auto')" id="btnAuto">Upgrade (1 SP)</button>
        </div>
    </div>
</div>

<script>
    // Configuration
    let gameState = {
        mana: 0,
        sp: 0,
        bossHp: 100,
        bossMaxHp: 100,
        level: 1,
        upgrades: { click: 0, auto: 0 }
    };

    function init() {
        const saved = JSON.parse(localStorage.getItem('constelliaBossData'));
        if (saved) gameState = saved;
        
        // Passive Mana Generation
        setInterval(() => {
            gameState.mana += (gameState.upgrades.auto * 2);
            updateDisplay();
        }, 1000);

        updateDisplay();
    }

    function clickMana() {
        gameState.mana += (1 + (gameState.upgrades.click * 3));
        updateDisplay();
    }

    function manaBurst() {
        if (gameState.mana <= 0) return;

        const damage = gameState.mana;
        gameState.mana = 0;
        gameState.bossHp -= damage;

        // Visual feedback
        document.getElementById('bossContainer').classList.add('boss-hit');
        setTimeout(() => document.getElementById('bossContainer').classList.remove('boss-hit'), 400);

        if (gameState.bossHp <= 0) {
            bossDefeated();
        }
        
        updateDisplay();
    }

    function bossDefeated() {
        gameState.sp += 1;
        gameState.level += 1;
        // Boss gets stronger next time
        gameState.bossMaxHp = Math.floor(100 * Math.pow(1.5, gameState.level - 1));
        gameState.bossHp = gameState.bossMaxHp;
        alert("Boss Defeated! You gained 1 Skill Point.");
    }

    function buyUpgrade(type) {
        if (gameState.sp >= 1) {
            gameState.sp -= 1;
            gameState.upgrades[type]++;
            save();
            updateDisplay();
        }
    }

    function updateDisplay() {
        // Update Mana and SP
        document.getElementById('manaView').innerText = `${Math.floor(gameState.mana)} MANA`;
        document.getElementById('spView').innerText = `SKILL POINTS: ${gameState.sp}`;
        
        // Update HP Bar
        const hpPercent = Math.max((gameState.bossHp / gameState.bossMaxHp) * 100, 0);
        document.getElementById('hpFill').style.width = hpPercent + "%";
        document.getElementById('hpText').innerText = `${Math.max(Math.floor(gameState.bossHp), 0)} / ${gameState.bossMaxHp} HP`;

        // Update Mage Filter based on mana progress toward 100 (Arbitrary "full" look)
        const manaSaturation = Math.min(gameState.mana / 100, 1);
        document.getElementById('mageGauge').style.filter = `grayscale(${100 - (manaSaturation * 100)}%)`;

        // UPDATE UPGRADE BUTTONS (The Fix)
        const clickBtn = document.getElementById('btnClick');
        const autoBtn = document.getElementById('btnAuto');
        
        document.getElementById('lvlClick').innerText = gameState.upgrades.click;
        document.getElementById('lvlAuto').innerText = gameState.upgrades.auto;

        // Force check SP count to enable/disable buttons
        if (gameState.sp >= 1) {
            clickBtn.disabled = false;
            autoBtn.disabled = false;
            clickBtn.style.borderColor = "var(--exp-gold)";
            autoBtn.style.borderColor = "var(--exp-gold)";
        } else {
            clickBtn.disabled = true;
            autoBtn.disabled = true;
            clickBtn.style.borderColor = "#444";
            autoBtn.style.borderColor = "#444";
        }

        save();
    }

    function save() {
        localStorage.setItem('constelliaBossData', JSON.stringify(gameState));
    }
</script>
</body>
</html>

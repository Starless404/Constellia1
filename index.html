<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constellia Clicker: The Magic Wall</title>
    <style>
        :root { 
            --mana-blue: #00d4ff; 
            --star-silver: #e0e0e0;
            --hp-red: #ff4d4d;
            --exp-gold: #ffd700;
        }
        body { 
            background-color: #050208; color: var(--mana-blue); 
            font-family: 'Garamond', serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; margin: 0; padding: 20px;
            background-image: radial-gradient(circle at center, #1a0b2e 0%, #050208 100%);
            overflow: hidden;
        }

        /* Elemental Particles */
        .elemental {
            position: absolute; width: 6px; height: 6px; 
            background: var(--mana-blue); border-radius: 50%;
            box-shadow: 0 0 10px var(--mana-blue);
            pointer-events: none; z-index: 1;
            transition: all 0.5s ease-out;
        }

        .mage-container { position: relative; width: 220px; height: 220px; margin-bottom: 10px; z-index: 5; }
        #mageGauge { width: 100%; height: 100%; object-fit: contain; }

        .boss-area { width: 480px; margin-bottom: 20px; text-align: center; z-index: 5; }
        .hp-background { background: #111; height: 20px; width: 100%; border: 1px solid #444; border-radius: 3px; overflow: hidden; position: relative; }
        .hp-fill { background: linear-gradient(90deg, #500, var(--hp-red)); height: 100%; width: 100%; transition: width 0.2s; }
        .hp-text { position: absolute; width: 100%; top: 0; color: white; font-size: 0.8rem; line-height: 20px; font-weight: bold; }

        .constellia-box { 
            border: 2px solid var(--mana-blue); padding: 25px; background: rgba(5, 2, 8, 0.95); 
            width: 480px; text-align: center; border-radius: 15px; box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
            z-index: 10;
        }
        
        .mana-display { font-size: 2rem; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .sp-display { color: var(--exp-gold); font-size: 1rem; margin-bottom: 15px; letter-spacing: 1px; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        button { 
            background: rgba(0, 212, 255, 0.05); color: var(--mana-blue); border: 1px solid var(--mana-blue); 
            padding: 10px; cursor: pointer; text-transform: uppercase; transition: 0.2s; font-weight: bold; font-size: 0.75rem;
        }
        button:hover:not(:disabled) { background: var(--mana-blue); color: #000; }
        button:disabled { border-color: #333; color: #333; cursor: not-allowed; }

        .upgrade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .upgrade-card { border: 1px solid #333; padding: 8px; font-size: 0.7rem; border-radius: 5px; background: rgba(255,255,255,0.02); }
        .upgrade-card b { color: var(--exp-gold); }

        @keyframes hit { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .wall-hit { animation: hit 0.1s ease-in-out; }
    </style>
</head>
<body onload="init()">

<div class="boss-area" id="bossContainer">
    <div style="color: var(--star-silver); font-weight: bold; letter-spacing: 5px; margin-bottom: 5px;">MAGIC WALL</div>
    <div class="hp-background">
        <div class="hp-fill" id="hpFill"></div>
        <div class="hp-text" id="hpText">100 / 100 HP</div>
    </div>
</div>

<div class="mage-container">
    <img src="image_2a4d99.jpg" id="mageGauge" alt="Mana Mage">
</div>

<div class="constellia-box">
    <div class="mana-display" id="manaView">0 MANA</div>
    <div class="sp-display" id="spView">SKILL POINTS: 0</div>
    
    <div class="btn-group">
        <button onclick="clickMana()">Channel Mana</button>
        <button onclick="manaBurst()" id="burstBtn" style="color:var(--hp-red); border-color:var(--hp-red)">Mana Burst</button>
        <button onclick="summonElemental()" id="summonBtn" style="grid-column: span 2;">Summon Elemental (Cost: 25 Mana)</button>
    </div>

    <div class="upgrade-grid">
        <div class="upgrade-card">
            <div>Mana Potency (Lvl <span id="lvlClick">0</span>)</div>
            <button onclick="buyUpgrade('click')" id="btnClick">Upgrade (1 SP)</button>
        </div>
        <div class="upgrade-card">
            <div>Auto Flux (Lvl <span id="lvlAuto">0</span>)</div>
            <button onclick="buyUpgrade('auto')" id="btnAuto">Upgrade (1 SP)</button>
        </div>
        <div class="upgrade-card" style="grid-column: span 2; border-color: var(--mana-blue);">
            <div>Elemental Potency (Lvl <span id="lvlElem">0</span>)</div>
            <p style="margin: 4px 0;">Current DPS: <b id="dpsView">0</b></p>
            <button onclick="buyUpgrade('elem')" id="btnElem">Upgrade Damage (1 SP)</button>
        </div>
    </div>
</div>

<script>
    let gameState = {
        mana: 0, sp: 0,
        bossHp: 100, bossMaxHp: 100,
        level: 1,
        elementals: 0,
        upgrades: { click: 0, auto: 0, elem: 0 }
    };

    let elementalEntities = [];

    function init() {
        const saved = JSON.parse(localStorage.getItem('constelliaWallData'));
        if (saved) gameState = saved;
        
        // Main Logic Loop (10 ticks per second for smooth movement)
        setInterval(gameTick, 100);
        updateDisplay();
    }

    function gameTick() {
        // Passive Mana
        gameState.mana += (gameState.upgrades.auto * 2) / 10;
        
        // Elemental Passive Damage
        if (gameState.elementals > 0) {
            const dmgPerTick = (gameState.elementals * (1 + gameState.upgrades.elem * 2)) / 10;
            dealDamage(dmgPerTick);
        }

        updateDisplay();
        moveElementals();
    }

    function dealDamage(amount) {
        gameState.bossHp -= amount;
        if (gameState.bossHp <= 0) {
            gameState.sp += 1;
            gameState.level += 1;
            gameState.bossMaxHp = Math.floor(100 * Math.pow(1.6, gameState.level - 1));
            gameState.bossHp = gameState.bossMaxHp;
            document.getElementById('bossContainer').classList.add('wall-hit');
            setTimeout(() => document.getElementById('bossContainer').classList.remove('wall-hit'), 200);
        }
    }

    function clickMana() {
        gameState.mana += (1 + (gameState.upgrades.click * 3));
    }

    function manaBurst() {
        if (gameState.mana > 0) {
            dealDamage(gameState.mana);
            gameState.mana = 0;
        }
    }

    function summonElemental() {
        const cost = 25 + (gameState.elementals * 10);
        if (gameState.mana >= cost) {
            gameState.mana -= cost;
            gameState.elementals++;
            createElementalVisual();
        }
    }

    function createElementalVisual() {
        const el = document.createElement('div');
        el.className = 'elemental';
        document.body.appendChild(el);
        elementalEntities.push({
            dom: el,
            angle: Math.random() * Math.PI * 2,
            dist: 120 + Math.random() * 40,
            speed: 0.02 + Math.random() * 0.05
        });
    }

    function moveElementals() {
        elementalEntities.forEach(e => {
            e.angle += e.speed;
            const x = window.innerWidth / 2 + Math.cos(e.angle) * e.dist;
            const y = window.innerHeight / 2 + Math.sin(e.angle) * e.dist - 50;
            e.dom.style.left = x + 'px';
            e.dom.style.top = y + 'px';
        });
    }

    function buyUpgrade(type) {
        if (gameState.sp >= 1) {
            gameState.sp -= 1;
            gameState.upgrades[type]++;
            updateDisplay();
        }
    }

    function updateDisplay() {
        document.getElementById('manaView').innerText = `${Math.floor(gameState.mana)} MANA`;
        document.getElementById('spView').innerText = `SKILL POINTS: ${gameState.sp}`;
        
        const hpPercent = Math.max((gameState.bossHp / gameState.bossMaxHp) * 100, 0);
        document.getElementById('hpFill').style.width = hpPercent + "%";
        document.getElementById('hpText').innerText = `${Math.max(Math.floor(gameState.bossHp), 0)} / ${gameState.bossMaxHp} HP`;

        document.getElementById('lvlClick').innerText = gameState.upgrades.click;
        document.getElementById('lvlAuto').innerText = gameState.upgrades.auto;
        document.getElementById('lvlElem').innerText = gameState.upgrades.elem;
        
        const dps = gameState.elementals * (1 + gameState.upgrades.elem * 2);
        document.getElementById('dpsView').innerText = dps.toFixed(1);

        const summonCost = 25 + (gameState.elementals * 10);
        document.getElementById('summonBtn').innerText = `Summon Elemental (${summonCost} Mana)`;
        document.getElementById('summonBtn').disabled = gameState.mana < summonCost;

        // Skill Point Button Fix
        ['btnClick', 'btnAuto', 'btnElem'].forEach(id => {
            const btn = document.getElementById(id);
            btn.disabled = gameState.sp < 1;
            btn.style.borderColor = gameState.sp >= 1 ? "var(--exp-gold)" : "#333";
        });

        localStorage.setItem('constelliaWallData', JSON.stringify(gameState));
    }
</script>
</body>
</html>
